version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app/news-storage-01-firebase-adminsdk-fbsvc-934ae7bccd.json:/app/app/news-storage-01-firebase-adminsdk-fbsvc-934ae7bccd.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
